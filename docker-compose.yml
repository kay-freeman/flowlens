services:
  postgres:
    image: postgres:17-alpine
    container_name: flowlens-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowlens}
      POSTGRES_USER: ${POSTGRES_USER:-flowlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowlens_dev_password}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - flowlens_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  flowlens_postgres_data:
    name: flowlens_postgres_data