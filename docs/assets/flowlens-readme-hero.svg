<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="420"
  viewBox="0 0 1200 420"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">FlowLens</title>
  <desc id="description">
    FlowLens turns fragmented business processes into configurable,
    measurable workflows.
  </desc>

  <defs>
    <linearGradient
      id="background"
      x1="0"
      y1="0"
      x2="1200"
      y2="420"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#15102A" />
      <stop offset="0.5" stop-color="#24134B" />
      <stop offset="1" stop-color="#102D3C" />
    </linearGradient>

    <linearGradient
      id="accent"
      x1="210"
      y1="0"
      x2="990"
      y2="0"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#A78BFA" />
      <stop offset="0.5" stop-color="#7C3AED" />
      <stop offset="1" stop-color="#2DD4BF" />
    </linearGradient>

    <linearGradient
      id="lens"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop offset="0" stop-color="#C4B5FD" />
      <stop offset="1" stop-color="#2DD4BF" />
    </linearGradient>

    <radialGradient id="purpleGlow">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.32" />
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="tealGlow">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.25" />
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0" />
    </radialGradient>

    <pattern
      id="grid"
      width="32"
      height="32"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M 32 0 L 0 0 0 32"
        fill="none"
        stroke="#FFFFFF"
        stroke-opacity="0.045"
        stroke-width="1"
      />
    </pattern>

    <filter
      id="shadow"
      x="-30%"
      y="-30%"
      width="160%"
      height="160%"
    >
      <feDropShadow
        dx="0"
        dy="12"
        stdDeviation="18"
        flood-color="#080511"
        flood-opacity="0.5"
      />
    </filter>

    <filter
      id="softGlow"
      x="-60%"
      y="-60%"
      width="220%"
      height="220%"
    >
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect
    width="1200"
    height="420"
    rx="28"
    fill="url(#background)"
  />

  <rect
    width="1200"
    height="420"
    rx="28"
    fill="url(#grid)"
  />

  <ellipse
    cx="280"
    cy="120"
    rx="330"
    ry="250"
    fill="url(#purpleGlow)"
  />

  <ellipse
    cx="1050"
    cy="340"
    rx="350"
    ry="270"
    fill="url(#tealGlow)"
  />

  <path
    d="M 0 345 C 230 285, 360 455, 610 370
       C 820 300, 970 360, 1200 285"
    fill="none"
    stroke="url(#accent)"
    stroke-opacity="0.2"
    stroke-width="2"
  />

