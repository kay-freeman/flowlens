name: FlowLens CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and migrations
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+psycopg://flowlens:flowlens_dev_password@localhost:5432/flowlens

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: flowlens
          POSTGRES_USER: flowlens
          POSTGRES_PASSWORD: flowlens_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowlens -d flowlens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install API dependencies
        run: python -m pip install -e "apps/api[dev]"

      - name: Apply database migrations
        working-directory: apps/api
        run: alembic upgrade head

      - name: Verify migration consistency
        working-directory: apps/api
        run: alembic check

      - name: Run backend tests
        run: pytest apps/api/tests -v

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run frontend lint
        working-directory: apps/web
        run: npm run lint

      - name: Build frontend
        working-directory: apps/web
        run: npm run build